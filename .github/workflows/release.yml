name: Build and release

on:
  push:
    branches: [main]

concurrency:
  group: dailywallpaper-release
  queue: max

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Determine release version
        id: version
        run: |
          $semver = '^v\d+\.\d+\.\d+$'
          $tag = git tag --points-at $env:GITHUB_SHA --sort=-version:refname |
            Where-Object { $_ -match $semver } | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if (-not $tag) {
            $previous = git tag --list --sort=-version:refname |
              Where-Object { $_ -match $semver } | Select-Object -First 1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $tag = 'v1.0.0'
            if ($previous) {
              $version = [version]$previous.Substring(1)
              $tag = "v$($version.Major).$($version.Minor).$($version.Build + 1)"
            }
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "number=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT

      - name: Build single-file executable
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.number }}
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'dailywallpaper-build'
          dotnet build BingWallpapers.csproj -c Release -o $output "-p:Version=$env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $exe = Join-Path $output 'BingWallpapers.exe'
          $version = [Reflection.AssemblyName]::GetAssemblyName($exe).Version.ToString(3)
          if ($version -ne $env:RELEASE_VERSION) {
            throw "The executable version is $version. Expected $env:RELEASE_VERSION."
          }
          Rename-Item -LiteralPath $exe -NewName "DailyWallpaper-$env:RELEASE_VERSION.exe"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.number }}
        run: |
          $asset = Join-Path $env:RUNNER_TEMP "dailywallpaper-build\DailyWallpaper-$env:RELEASE_VERSION.exe"
          $existing = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft,targetCommitish 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $existing | ConvertFrom-Json
            if (-not $release.isDraft) {
              Write-Host "$env:RELEASE_TAG is already published."
              exit 0
            }
            if ($release.targetCommitish -ne $env:GITHUB_SHA) {
              throw "$env:RELEASE_TAG is reserved by a draft for a different commit."
            }
            gh release upload $env:RELEASE_TAG $asset --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false
          } else {
            gh release create $env:RELEASE_TAG $asset --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA --title "DailyWallpaper $env:RELEASE_TAG" --generate-notes
          }
